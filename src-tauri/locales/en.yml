# Crear, editar y borrar un contacto (vasak-contacts#2/#3).
form:
  newTitle: New contact
  editTitle: Edit contact
  name: Name
  namePlaceholder: Full name
  organization: Organization
  addressBook: Address book
  emailPlaceholder: name@example.com
  phonePlaceholder: Phone
  relationPlaceholder: Person's name
  addEmail: Add email
  addPhone: Add phone
  addRelation: Add relationship
  remove: Remove
  cancel: Cancel
  create: Create
  save: Save
  edit: Edit
  editPending: "Waiting to sync: cannot edit yet"
  delete: Delete
  deleteTitle: Delete contact
  deleteConfirm: "Delete {0}? This cannot be undone."
  denied: You have not allowed changing the contacts stored on the system.
  error: The change could not be completed.
  # Los vínculos de una relación, para el selector del formulario.
  relations:
    spouse: spouse
    child: child
    parent: parent
    sibling: sibling
    friend: friend
    partner: partner
    assistant: assistant
    manager: manager
    other: other
# Elegir qué libretas se ven y filtrar por categoría, en el panel de cuentas.
filtros:
  libretas: Address books
  categorias: Categories
  limpiarCategorias: Clear the category filter
# Los botones de ir y volver entre columnas, con la ventana angosta.
nav:
  accounts: Accounts
  contacts: Contacts
sync:
  pending: Waiting to sync
  syncing: Syncing…
  synced: Up to date
  syncedAt: "Up to date · {0}"
  failed: "Could not sync: {0}"
  unavailable: "Not available: {0}"
  request:
    denied: You did not allow syncing this account
    too_soon: Just refreshed; you can refresh again in a moment
    unavailable: The sync service is not running
    failed: Could not request a sync
  # La insignia «sin sincronizar» de cada contacto, en la lista y en la ficha.
  # Ver `src/tools/sync-badge.ts`.
  badge:
    pending: Not synced
    pendingTitle: A change is waiting to upload; it syncs when it can
    conflict: Conflict
    conflictTitle: The change clashed with the server; pick which one stays
# Resolver un conflicto: un cambio local que chocó con el servidor. El banner en
# la ficha y la comparación «mantener la mía / tomar la del servidor».
conflict:
  # El banner de la ficha.
  bannerTitle: This contact has a conflict
  bannerBody: You changed it here and it also changed on the server. Pick which version stays.
  resolve: Resolve
  # El diálogo de la comparación.
  title: Resolve the conflict
  explain: Compare the two versions and pick which one stays. The other is discarded.
  loading: Fetching the comparison…
  mine: Mine
  theirs: The server's
  mineDelete: You deleted it here.
  serverUnavailable: There is no server copy to compare yet.
  retry: Retry
  keepMine: Keep mine
  takeTheirs: Take the server's
  denied: You did not allow changing the contacts stored on the system.
  error: Could not resolve the conflict.
# El estado de «sin permiso» para leer el almacén, con el botón que vuelve a
# abrir el diálogo. Ver `src/tools/store-permission.ts`.
permiso:
  titulo: No permission to see contacts
  descripcion: You have not allowed reading the contacts stored on the system. Ask for it again to bring the dialog back.
  pedir: Ask for permission again
  # Cuando no se pudo ni volver a pedir el permiso.
  limite: You just asked a moment ago; wait a minute and try again.
  denegado: This permission cannot be requested again.
  error: Could not ask for the permission again.
# The mail history on a contact's card (vasak-contacts#11).
mailHistory:
  title: Mail history
  off: Show here the latest emails you exchanged with this person. They are looked up when the card opens and are not stored.
  enable: Turn on
  disable: Turn off
  loading: Looking for emails…
  empty: No emails with this person.
  denied: Contacts is not allowed to see your mail history.
  unavailable: Mail history is not available for this account.
  from: "From {0}"
  noSubject: (no subject)
# The business card: the QR code and which card is the person's own
# (vasak-contacts#10).
qr:
  title: Card QR code
  explain: Choose which details go in the code. Whoever scans it will see them, and nothing else is shared.
  fields: Details in the code
  name: Name
  # What never goes; not a checkbox.
  never: The photo never goes in the code.
  alt: Card QR code
  placeholder: Tick what you want to share and press "Generate code".
  generate: Generate code
  close: Close
  show: Show QR
  mine: My QR code
  thisIsMe: This is me
  markMe: Mark as my card
  unmarkMe: Stop marking as my card
  isMe: Your card
  empty: Tick at least one detail to generate the code.
  tooLong: What is ticked does not fit in a code that can be scanned. Remove some detail.
  error: The code could not be generated.
ownCard:
  title: Your card
  looking: Looking for your card on the server…
  # `{0}` is the contact's name.
  proposal: "The server says your card is {0}'s. Is it yours?"
  none: Your server does not say which card is yours. Open it from the list and press "This is me".
  confirm: Yes, it is mine
  close: Close
