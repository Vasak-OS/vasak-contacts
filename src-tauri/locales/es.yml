_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Contactos
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
cuentas:
  titulo: Cuentas
  sinCuentasTitulo: Todavía no hay ninguna libreta
  sinCuentasDescripcion: Conectá una cuenta desde Configuración y sus contactos aparecen acá.
  necesitaReconectarse: Hay que volver a conectarla desde Configuración
  noSePudoLeerTodo: No se pudo leer todo
lista:
  cargando: Buscando contactos…
  actualizar: Actualizar
  buscar: Buscar
  vacia: No hay nadie en esta libreta
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  sinResultados: "No hay nadie que coincida con «{0}»"
  sinNombre: (sin nombre)
  # Para el grupo de los que no empiezan con una letra.
  otros: Otros
  cuantosOne: "{0} contacto"
  cuantosOther: "{0} contactos"
contacto:
  elegiUno: Elegí un contacto para verlo
  correos: Correo
  telefonos: Teléfono
  organizacion: Dónde trabaja
  notas: Notas
  escribir: Escribir
  llamar: Llamar
  copiar: Copiar
  copiado: Copiado
  # Se dice porque cambia lo que la persona puede esperar de la ventana.
  soloLectura: Esta versión muestra los contactos; editarlos viene después.
