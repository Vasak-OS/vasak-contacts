_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Contactos
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
cuentas:
  titulo: Cuentas
  sinCuentasTitulo: Todavía no hay ninguna libreta
  sinCuentasDescripcion: Conectá una cuenta desde Configuración y sus contactos aparecen acá.
  necesitaReconectarse: Hay que volver a conectarla desde Configuración
  noSePudoLeerTodo: No se pudo leer todo
lista:
  cargando: Buscando contactos…
  actualizar: Actualizar
  buscar: Buscar
  vacia: No hay nadie en esta libreta
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  sinResultados: "No hay nadie que coincida con «{0}»"
  sinNombre: (sin nombre)
  # Para el grupo de los que no empiezan con una letra.
  otros: Otros
  cuantosOne: "{0} contacto"
  cuantosOther: "{0} contactos"
contact:
  pickOne: Elegí un contacto para verlo
  emails: Correo
  phones: Teléfono
  notes: Notas
  write: Escribir
  call: Llamar
  copy: Copiar
  copied: Copiado
  open: Abrir
  relations: Relaciones
  # `{0}` es el nombre del contacto.
  photoAlt: "Foto de {0}"
  photoTooLarge: La foto de esta tarjeta es demasiado grande para mostrarla.
  photoInsecure: La foto está en una dirección sin cifrar y no se descarga.
  addresses: Dirección
  dates: Fechas
  birthday: Cumpleaños
  anniversary: Aniversario
  otherDate: Fecha
  websites: Web
  social: Redes y mensajería
  categories: Categorías
  more: Más datos
  languages: Idiomas
  timeZone: Zona horaria
  location: Ubicación
  kinds:
    org: Organización
    group: Grupo
    location: Lugar
  # Las etiquetas de siempre. Las que escribió la persona se muestran como
  # vinieron.
  labels:
    home: casa
    work: trabajo
    cell: celular
    mobile: celular
    main: principal
    fax: fax
    pager: buscapersonas
    other: otro
    homepage: página personal
    blog: blog
    profile: perfil
    anniversary: aniversario
    school: escuela
# Crear, editar y borrar un contacto (vasak-contacts#2/#3).
form:
  newTitle: Nuevo contacto
  editTitle: Editar contacto
  name: Nombre
  namePlaceholder: Nombre y apellido
  organization: Organización
  addressBook: Libreta
  emailPlaceholder: nombre@ejemplo.com
  phonePlaceholder: Teléfono
  relationPlaceholder: Nombre de la persona
  addEmail: Agregar correo
  addPhone: Agregar teléfono
  addRelation: Agregar relación
  remove: Quitar
  cancel: Cancelar
  create: Crear
  save: Guardar
  edit: Editar
  # Hasta que el contacto tenga ETag no se puede editar sin arriesgar a pisar
  # un cambio de otro lado: se muestra pendiente (punto 5).
  editPending: "Pendiente de sincronizar: todavía no se puede editar"
  delete: Borrar
  deleteTitle: Borrar contacto
  # `{0}` es el nombre del contacto.
  deleteConfirm: "¿Borrar a {0}? No se puede deshacer."
  denied: No diste permiso para cambiar los contactos guardados en el sistema.
  error: No se pudo completar el cambio.
  # Los vínculos de una relación, para el selector del formulario.
  relations:
    spouse: cónyuge
    child: hijo/a
    parent: padre/madre
    sibling: hermano/a
    friend: amistad
    partner: pareja
    assistant: asistente
    manager: jefe/a
    other: otro
# Elegir qué libretas se ven y filtrar por categoría, en el panel de cuentas.
filtros:
  libretas: Libretas
  categorias: Categorías
  limpiarCategorias: Quitar el filtro de categorías
# Los botones de ir y volver entre columnas, con la ventana angosta.
nav:
  accounts: Cuentas
  contacts: Contactos
# Cómo va la sincronización de cada cuenta, en el panel de cuentas.
sync:
  pending: Esperando para sincronizar
  syncing: Sincronizando…
  synced: Al día
  syncedAt: "Al día · {0}"
  failed: "No se pudo sincronizar: {0}"
  unavailable: "No disponible: {0}"
  request:
    denied: No diste permiso para sincronizar esta cuenta
    too_soon: Se acaba de actualizar; en un momento se puede de nuevo
    unavailable: El servicio de sincronización no está funcionando
    failed: No se pudo pedir la sincronización
  # La insignia «sin sincronizar» de cada contacto, en la lista y en la ficha.
  # Ver `src/tools/sync-badge.ts`.
  badge:
    pending: Sin sincronizar
    pendingTitle: Hay un cambio sin subir; se sincroniza cuando se pueda
    conflict: Conflicto
    conflictTitle: El cambio chocó con el servidor; hay que elegir cuál queda
# Resolver un conflicto: un cambio local que chocó con el servidor. El banner en
# la ficha y la comparación «mantener la mía / tomar la del servidor».
conflict:
  # El banner de la ficha.
  bannerTitle: Este contacto tiene un conflicto
  bannerBody: Lo cambiaste acá y también cambió en el servidor. Elegí cuál versión queda.
  resolve: Resolver
  # El diálogo de la comparación.
  title: Resolver el conflicto
  explain: Compará las dos versiones y elegí cuál queda. La otra se descarta.
  loading: Trayendo la comparación…
  mine: La mía
  theirs: La del servidor
  mineDelete: Lo borraste acá.
  serverUnavailable: Todavía no hay copia del servidor para comparar.
  retry: Reintentar
  keepMine: Mantener la mía
  takeTheirs: Tomar la del servidor
  denied: No diste permiso para cambiar los contactos guardados en el sistema.
  error: No se pudo resolver el conflicto.
# El estado de «sin permiso» para leer el almacén, con el botón que vuelve a
# abrir el diálogo. Ver `src/tools/store-permission.ts`.
permiso:
  titulo: Sin permiso para ver los contactos
  descripcion: No diste permiso para leer los contactos guardados en el sistema. Volvé a pedirlo para que aparezca el diálogo.
  pedir: Pedir permiso de nuevo
  # Cuando no se pudo ni volver a pedir el permiso.
  limite: Ya lo pediste hace un momento; esperá un minuto y probá de nuevo.
  denegado: No se puede volver a pedir este permiso.
  error: No se pudo volver a pedir el permiso.
# El historial de correo de la ficha de un contacto (vasak-contacts#11).
mailHistory:
  title: Historial de correo
  off: Mostrar acá los últimos correos que intercambiaste con esta persona. Se consultan al abrir la ficha y no se guardan.
  enable: Activar
  disable: Desactivar
  loading: Buscando correos…
  empty: No hay correos con esta persona.
  denied: Contactos no tiene permiso para ver tu historial de correo.
  unavailable: El historial de correo no está disponible para esta cuenta.
  from: "De {0}"
  noSubject: (sin asunto)
# La tarjeta de presentación: el código QR y cuál es la tarjeta propia
# (vasak-contacts#10).
qr:
  title: Código QR de la tarjeta
  explain: Elegí qué datos van en el código. Quien lo escanee los va a ver, y no se comparte nada más.
  fields: Datos que van en el código
  name: Nombre
  # Lo que nunca va; no es una casilla.
  never: La foto nunca va en el código.
  alt: Código QR de la tarjeta
  placeholder: Marcá lo que querés compartir y apretá «Generar código».
  generate: Generar código
  close: Cerrar
  show: Mostrar QR
  mine: Mi código QR
  thisIsMe: Este soy yo
  markMe: Marcar como mi tarjeta
  unmarkMe: Dejar de marcar como mi tarjeta
  isMe: Tu tarjeta
  empty: Marcá al menos un dato para generar el código.
  tooLong: Lo marcado no entra en un código que se pueda escanear. Sacá algún dato.
  error: No se pudo generar el código.
ownCard:
  title: Tu tarjeta
  looking: Buscando tu tarjeta en el servidor…
  # `{0}` es el nombre del contacto.
  proposal: "El servidor dice que tu tarjeta es la de {0}. ¿Es la tuya?"
  none: Tu servidor no dice cuál es tu tarjeta. Abrila desde la lista y tocá «Este soy yo».
  confirm: Sí, es la mía
  close: Cerrar
